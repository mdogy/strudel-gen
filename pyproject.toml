[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[project]
name = "strudel-gen"
version = "0.1.0"
description = "Generative ambient soundscape pipeline: Strudel → SuperDirt → WAV"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "platformdirs>=4.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.scripts]
strudel-gen = "strudel_gen.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-bdd>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "syrupy>=4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov --cov-fail-under=85"
markers = [
    "slow: slow tests (acceptance / integration) that are skipped by default",
    "network: tests that require network access",
]

[tool.coverage.run]
source = ["src/strudel_gen"]
