name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/
      - name: Mypy
        run: mypy --strict src/

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts/
          severity: warning

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v14
        with:
          globs: |
            *.md
            docs/**/*.md
            skill/**/*.md

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov --cov-fail-under=85

  wsl:
    name: Test (WSL2 / Ubuntu)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WSL Ubuntu 22.04
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04
      - name: Install Python deps in WSL
        shell: wsl-bash {0}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 python3-pip python3-venv
          pip3 install -e ".[dev]" --break-system-packages
      - name: Run unit tests in WSL
        shell: wsl-bash {0}
        run: python3 -m pytest tests/unit/ -v --tb=short -x
