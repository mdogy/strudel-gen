name: Nightly

on:
  schedule:
    - cron: '0 7 * * *'

jobs:
  slow-tests:
    name: Slow / acceptance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run slow tests
        run: pytest tests/ -v --tb=short --cov -m slow
