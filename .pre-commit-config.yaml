repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--strict, --no-warn-unused-ignores, src/, tests/unit/, --explicit-package-bases]
        language: python
        types: [python]
        require_serial: true
        pass_filenames: false
        additional_dependencies:
          - pydantic>=2.0
          - typer>=0.9
          - psutil>=5.9
          - pytest>=7.0
          - jinja2>=3.1
          - rich>=13.0

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
